<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingo‑Ville · Control Panel</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          teal: { DEFAULT: '#00aba5', 50: '#e6f7f6', 600: '#008984', 700: '#006762' },
          orange: { DEFAULT: '#F8A233', 500: '#F8A233', 600: '#e6821f' }
        },
        boxShadow: { soft: '0 8px 30px rgba(0,0,0,0.06)' }
      }}
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:'Nunito',system-ui,sans-serif}</style>
</head>
<body data-page="dashboard" class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800">

  <!-- ===== PIN GATE ===== -->
  <section id="pinScreen" class="hidden min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-soft p-8 max-w-md w-full">
      <h1 class="text-2xl font-extrabold mb-2">Admin Access</h1>
      <p class="text-sm text-slate-500 mb-6">Enter your admin PIN to open the control panel.</p>
      <form id="pinForm" class="space-y-4">
        <input type="password" id="pinInput" placeholder="••••••" autocomplete="off" required
               class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal focus:border-teal outline-none" />
        <button type="submit" id="pinSubmitBtn"
                class="w-full py-3 bg-teal text-white font-bold rounded-xl hover:bg-teal-600 transition">
          Unlock
        </button>
      </form>
      <p id="pinError" class="text-sm text-red-500 mt-3 hidden"></p>
    </div>
  </section>

  <!-- ===== APP ===== -->
  <div id="appScreen" class="hidden">
    <div id="navMount"></div>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

      <!-- Stats -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl shadow-soft p-5">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-bold">Total</p>
          <p id="statTotal" class="text-3xl font-extrabold text-slate-800 mt-1">—</p>
        </div>
        <div class="bg-white rounded-2xl shadow-soft p-5">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-bold">Active</p>
          <p id="statActive" class="text-3xl font-extrabold text-teal mt-1">—</p>
        </div>
        <div class="bg-white rounded-2xl shadow-soft p-5">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-bold">Revoked</p>
          <p id="statRevoked" class="text-3xl font-extrabold text-red-500 mt-1">—</p>
        </div>
        <div class="bg-white rounded-2xl shadow-soft p-5">
          <p class="text-xs uppercase tracking-wide text-slate-400 font-bold">With Report</p>
          <p id="statReports" class="text-3xl font-extrabold text-orange-500 mt-1">—</p>
        </div>
      </div>

      <!-- List -->
      <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
        <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-extrabold text-lg">Certificates</h2>
          <button id="refreshBtn" class="text-sm px-3 py-1.5 bg-slate-100 rounded-lg hover:bg-slate-200 transition">Refresh</button>
        </div>

        <div class="px-5 py-3 border-b border-slate-100 flex flex-col sm:flex-row gap-2 sm:items-center">
          <input id="filterInput" type="text" placeholder="Filter by ID, name, course…"
                 class="flex-1 px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal focus:border-teal outline-none text-sm" />
          <select id="statusFilter"
                  class="px-4 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal outline-none text-sm">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="revoked">Revoked</option>
            <option value="pending">Pending</option>
          </select>
        </div>

        <div id="tableWrap" class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wide">
                <tr>
                    <th class="text-left px-5 py-3 font-bold">Cert ID</th>
                    <th class="text-left px-5 py-3 font-bold">Student</th>
                    <th class="text-left px-5 py-3 font-bold hidden md:table-cell">Course</th>
                    <th class="text-left px-5 py-3 font-bold hidden md:table-cell">Level</th>
                    <th class="text-left px-5 py-3 font-bold hidden sm:table-cell">Issued</th>
                    <th class="text-left px-5 py-3 font-bold">Status</th>
                    <th class="text-right px-5 py-3 font-bold">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" class="text-center py-8 text-slate-400">Loading…</td></tr>
            </tbody>
          </table>
        </div>

        <p id="listMeta" class="text-xs text-slate-400 px-5 py-3 border-t border-slate-100"></p>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
